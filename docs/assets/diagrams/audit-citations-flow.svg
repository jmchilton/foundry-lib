<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" width="960" height="760" role="img" aria-labelledby="title desc">
  <title id="title">Citation audit component flow</title>
  <desc id="desc">A consuming repository supplies citation configuration to a filesystem adapter. Source documents pass through extraction and a citation scan, then normalized evidence from providers or offline replay enters evaluation with adjudications. The result is a citation audit run rendered as JSON and Markdown.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e2552b"/>
    </marker>
    <style>
      .bg { fill: #fbfaf6; stroke: #d6d0c3; stroke-width: 2; }
      .node { fill: #ffffff; stroke: #b9b1a2; stroke-width: 2; }
      .node-dark { fill: #262b32; stroke: #0e1013; stroke-width: 2; }
      .node-accent { fill: #f6ded4; stroke: #e2552b; stroke-width: 2; }
      .label { fill: #1a1d22; font: 700 18px Arial, sans-serif; }
      .label-dark { fill: #fbfaf6; font: 700 18px Arial, sans-serif; }
      .detail { fill: #555b63; font: 14px Arial, sans-serif; }
      .detail-dark { fill: #d9dde2; font: 14px Arial, sans-serif; }
      .eyebrow { fill: #9a3a1f; font: 700 12px Arial, sans-serif; letter-spacing: 1.8px; }
      .edge { fill: none; stroke: #e2552b; stroke-width: 3; marker-end: url(#arrow); }
      .edge-muted { fill: none; stroke: #777e87; stroke-width: 2.5; marker-end: url(#arrow); }
      .edge-both { fill: none; stroke: #777e87; stroke-width: 2.5; marker-start: url(#arrow); marker-end: url(#arrow); }
      .edge-label { fill: #555b63; font: 12px Arial, sans-serif; }
    </style>
  </defs>

  <rect class="bg" x="1" y="1" width="958" height="758" rx="14"/>
  <text class="eyebrow" x="40" y="38">CONSUMER-OWNED INPUT</text>
  <rect class="node-accent" x="40" y="55" width="880" height="72" rx="8"/>
  <text class="label" x="480" y="84" text-anchor="middle">CitationAuditConfig</text>
  <text class="detail" x="480" y="107" text-anchor="middle">source rules · artifact kinds · heading terms · trusted hosts · request budget</text>

  <path class="edge" d="M 480 127 V 164"/>
  <rect class="node" x="40" y="165" width="210" height="84" rx="8"/>
  <text class="label" x="145" y="197" text-anchor="middle">CLI adapter</text>
  <text class="detail" x="145" y="220" text-anchor="middle">glob files + optional Git filter</text>
  <text class="detail" x="145" y="239" text-anchor="middle">produces explicit documents</text>

  <path class="edge" d="M 250 207 H 300"/>
  <text class="edge-label" x="275" y="197" text-anchor="middle">docs</text>
  <rect class="node-dark" x="300" y="165" width="210" height="84" rx="8"/>
  <text class="label-dark" x="405" y="197" text-anchor="middle">Extractor</text>
  <text class="detail-dark" x="405" y="220" text-anchor="middle">identifiers + bibliography</text>
  <text class="detail-dark" x="405" y="239" text-anchor="middle">exact source spans</text>

  <path class="edge" d="M 510 207 H 560"/>
  <rect class="node" x="560" y="165" width="360" height="84" rx="8"/>
  <text class="label" x="740" y="197" text-anchor="middle">CitationScan</text>
  <text class="detail" x="740" y="220" text-anchor="middle">candidates · diagnostics · extraction coverage</text>
  <text class="detail" x="740" y="239" text-anchor="middle">stable occurrence identities</text>

  <path class="edge" d="M 740 249 V 305 H 480 V 333"/>
  <text class="edge-label" x="626" y="295" text-anchor="middle">evidence queries</text>

  <rect class="node" x="40" y="334" width="230" height="92" rx="8"/>
  <text class="label" x="155" y="369" text-anchor="middle">Offline replay</text>
  <text class="detail" x="155" y="393" text-anchor="middle">committed normalized cache</text>
  <text class="detail" x="155" y="413" text-anchor="middle">no network requests</text>

  <rect class="node-dark" x="335" y="334" width="290" height="92" rx="8"/>
  <text class="label-dark" x="480" y="369" text-anchor="middle">Normalized evidence</text>
  <text class="detail-dark" x="480" y="393" text-anchor="middle">collectEvidence</text>
  <text class="detail-dark" x="480" y="413" text-anchor="middle">resolved · unresolved · unavailable</text>

  <rect class="node" x="690" y="334" width="230" height="92" rx="8"/>
  <text class="label" x="805" y="369" text-anchor="middle">Provider resolver</text>
  <text class="detail" x="805" y="393" text-anchor="middle">registry + scholarly search</text>
  <text class="detail" x="805" y="413" text-anchor="middle">allowlist + deadlines</text>

  <path class="edge-muted" d="M 270 380 H 329"/>
  <path class="edge-both" d="M 631 380 H 684"/>

  <path class="edge" d="M 480 426 V 486"/>
  <text class="edge-label" x="495" y="461">evidence IDs</text>
  <rect class="node-dark" x="335" y="487" width="290" height="84" rx="8"/>
  <text class="label-dark" x="480" y="520" text-anchor="middle">Evaluator</text>
  <text class="detail-dark" x="480" y="544" text-anchor="middle">identity checks + mismatch severity</text>

  <rect class="node-accent" x="690" y="487" width="230" height="84" rx="8"/>
  <text class="label" x="805" y="520" text-anchor="middle">Adjudications</text>
  <text class="detail" x="805" y="544" text-anchor="middle">stale-safe manual review</text>
  <path class="edge-muted" d="M 690 529 H 631"/>

  <path class="edge" d="M 480 571 V 617"/>
  <rect class="node" x="280" y="618" width="400" height="74" rx="8"/>
  <text class="label" x="480" y="649" text-anchor="middle">CitationAuditRun</text>
  <text class="detail" x="480" y="672" text-anchor="middle">candidate snapshot · findings · digests · partitions</text>

  <path class="edge" d="M 480 692 V 727 H 735"/>
  <text class="eyebrow" x="750" y="733">JSON + MARKDOWN REPORT</text>
</svg>

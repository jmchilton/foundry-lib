<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="title desc">
  <title id="title">Kind-manifest provenance lifecycle</title>
  <desc id="desc">The producer resolves local schemas, declares repository identity and path, then builds and commits a deterministic manifest without a revision. A consumer fetches it at an immutable commit, parses the untrusted manifest, records the fetched revision, and renders a catalog or comparison.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e2552b"/>
    </marker>
    <style>
      .bg { fill: #fbfaf6; stroke: #d6d0c3; stroke-width: 2; }
      .zone { fill: #ffffff; stroke: #b9b1a2; stroke-width: 2; }
      .head { fill: #262b32; }
      .step { fill: #f6ded4; stroke: #e2552b; stroke-width: 1.5; }
      .label { fill: #1a1d22; font: 700 16px Arial, sans-serif; }
      .label-dark { fill: #fbfaf6; font: 700 18px Arial, sans-serif; }
      .detail { fill: #555b63; font: 13px Arial, sans-serif; }
      .edge { fill: none; stroke: #e2552b; stroke-width: 3; marker-end: url(#arrow); }
      .handoff { fill: #9a3a1f; font: 700 12px Arial, sans-serif; letter-spacing: 1px; }
    </style>
  </defs>

  <rect class="bg" x="1" y="1" width="958" height="468" rx="14"/>

  <rect class="zone" x="35" y="35" width="380" height="400" rx="10"/>
  <path class="head" d="M45 35h360a10 10 0 0 1 10 10v50H35V45a10 10 0 0 1 10-10z"/>
  <text class="label-dark" x="225" y="72" text-anchor="middle">Producer repository</text>

  <rect class="step" x="75" y="125" width="300" height="58" rx="7"/>
  <text class="label" x="225" y="151" text-anchor="middle">Resolve local schemas</text>
  <text class="detail" x="225" y="171" text-anchor="middle">instance context stays local</text>
  <path class="edge" d="M 225 183 V 213"/>

  <rect class="step" x="75" y="214" width="300" height="58" rx="7"/>
  <text class="label" x="225" y="240" text-anchor="middle">Declare identity</text>
  <text class="detail" x="225" y="260" text-anchor="middle">instance · repository · manifest path</text>
  <path class="edge" d="M 225 272 V 302"/>

  <rect class="step" x="75" y="303" width="300" height="78" rx="7"/>
  <text class="label" x="225" y="330" text-anchor="middle">Build + commit manifest</text>
  <text class="detail" x="225" y="351" text-anchor="middle">deterministic bytes</text>
  <text class="detail" x="225" y="370" text-anchor="middle">revision intentionally absent</text>

  <text class="handoff" x="480" y="197" text-anchor="middle">FETCH</text>
  <text class="handoff" x="480" y="215" text-anchor="middle">IMMUTABLE</text>
  <text class="handoff" x="480" y="233" text-anchor="middle">COMMIT</text>
  <path class="edge" d="M 415 254 H 539"/>

  <rect class="zone" x="545" y="35" width="380" height="400" rx="10"/>
  <path class="head" d="M555 35h360a10 10 0 0 1 10 10v50H545V45a10 10 0 0 1 10-10z"/>
  <text class="label-dark" x="735" y="72" text-anchor="middle">Consumer repository</text>

  <rect class="step" x="585" y="125" width="300" height="58" rx="7"/>
  <text class="label" x="735" y="151" text-anchor="middle">Parse untrusted manifest</text>
  <text class="detail" x="735" y="171" text-anchor="middle">strict versioned reader</text>
  <path class="edge" d="M 735 183 V 213"/>

  <rect class="step" x="585" y="214" width="300" height="58" rx="7"/>
  <text class="label" x="735" y="240" text-anchor="middle">Attach observation</text>
  <text class="detail" x="735" y="260" text-anchor="middle">record fetched revision immutably</text>
  <path class="edge" d="M 735 272 V 302"/>

  <rect class="step" x="585" y="303" width="300" height="78" rx="7"/>
  <text class="label" x="735" y="330" text-anchor="middle">Render or compare</text>
  <text class="detail" x="735" y="351" text-anchor="middle">catalog · cross-instance diff</text>
  <text class="detail" x="735" y="370" text-anchor="middle">identity and observation stay distinct</text>
</svg>

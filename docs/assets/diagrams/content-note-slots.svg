<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 660" width="760" height="660" role="img" aria-labelledby="title desc">
  <title id="title">The note frame and its local slots</title>
  <desc id="desc">NoteHeader owns a vertical frame containing a back link, an eyebrow naming the kind, the heading, the summary, and a row holding the status, the badges slot and shared TagChips, followed by optional raw and copy actions. ContentNote adds the metadata slot, the reference slot and the article boundary beneath it. Badges, metadata, reference and article content come from the Foundry instance.</desc>
  <defs>
    <style>
      .bg { fill: #fbfaf6; stroke: #d6d0c3; stroke-width: 2; }
      .shared { fill: #262b32; stroke: #0e1013; stroke-width: 2; }
      .slot { fill: #f6ded4; stroke: #e2552b; stroke-width: 2; }
      .article { fill: #e3f1eb; stroke: #23745e; stroke-width: 2; }
      .frame { fill: none; stroke: #8a8478; stroke-width: 2; stroke-dasharray: 6 5; }
      .label { fill: #fbfaf6; font: 700 16px Arial, sans-serif; }
      .local-label { fill: #1a1d22; font: 700 16px Arial, sans-serif; }
      .detail { fill: #555b63; font: 13px Arial, sans-serif; }
      .eyebrow { fill: #9a3a1f; font: 700 12px Arial, sans-serif; letter-spacing: 1.5px; }
      .frame-tag { fill: #6c665b; font: 700 12px Arial, sans-serif; letter-spacing: 1.2px; }
    </style>
  </defs>
  <rect class="bg" x="1" y="1" width="758" height="658" rx="14"/>
  <text class="eyebrow" x="38" y="36">READER NOTE — SHARED ORDER AND SEMANTICS</text>

  <rect class="frame" x="52" y="52" width="656" height="378" rx="10"/>
  <text class="frame-tag" x="66" y="72">NoteHeader</text>

  <rect class="shared" x="70" y="84" width="620" height="44" rx="7"/>
  <text class="label" x="380" y="112" text-anchor="middle">Back link</text>

  <rect class="shared" x="70" y="140" width="620" height="56" rx="7"/>
  <text class="label" x="380" y="166" text-anchor="middle">Eyebrow</text>
  <text class="detail" x="380" y="187" text-anchor="middle" style="fill:#d9dde2">the kind, as the instance words it</text>

  <rect class="shared" x="70" y="208" width="620" height="56" rx="7"/>
  <text class="label" x="380" y="234" text-anchor="middle">Heading</text>
  <text class="detail" x="380" y="255" text-anchor="middle" style="fill:#d9dde2">the frame owns the H1 unless the body says it owns its own</text>

  <rect class="shared" x="70" y="276" width="620" height="56" rx="7"/>
  <text class="label" x="380" y="302" text-anchor="middle">Summary</text>
  <text class="detail" x="380" y="323" text-anchor="middle" style="fill:#d9dde2">carries the Pagefind weight, so it outranks the body in search</text>

  <rect class="shared" x="70" y="344" width="196" height="72" rx="7"/>
  <text class="label" x="168" y="374" text-anchor="middle">Status</text>
  <text class="detail" x="168" y="396" text-anchor="middle" style="fill:#d9dde2">data-status;</text>
  <text class="detail" x="168" y="410" text-anchor="middle" style="fill:#d9dde2">instance owns the hues</text>
  <rect class="slot" x="282" y="344" width="196" height="72" rx="7"/>
  <text class="local-label" x="380" y="380" text-anchor="middle">Badges slot</text>
  <text class="detail" x="380" y="402" text-anchor="middle">domain labels</text>
  <rect class="shared" x="494" y="344" width="196" height="72" rx="7"/>
  <text class="label" x="592" y="374" text-anchor="middle">Shared TagChips</text>
  <text class="detail" x="592" y="396" text-anchor="middle" style="fill:#d9dde2">instance supplies</text>
  <text class="detail" x="592" y="410" text-anchor="middle" style="fill:#d9dde2">values and route</text>

  <rect class="slot" x="70" y="450" width="620" height="60" rx="7"/>
  <text class="local-label" x="380" y="476" text-anchor="middle">Metadata slot</text>
  <text class="detail" x="380" y="497" text-anchor="middle">source metadata or package facts — instance-owned</text>

  <rect class="slot" x="70" y="522" width="620" height="60" rx="7"/>
  <text class="local-label" x="380" y="548" text-anchor="middle">Reference slot</text>
  <text class="detail" x="380" y="569" text-anchor="middle">evidence or reference furniture — instance-owned</text>

  <rect class="article" x="70" y="594" width="620" height="52" rx="7"/>
  <text class="local-label" x="380" y="620" text-anchor="middle">Article boundary</text>
  <text class="detail" x="380" y="639" text-anchor="middle">instance prose classes + rendered domain content</text>
</svg>

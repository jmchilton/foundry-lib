<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="description"
      content="Documentation for foundry-lib, the shared TypeScript substrate for Foundry-pattern instances."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f1e8" />
    <title>foundry-lib</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fontsource-variable/geist@5.3.0/index.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fontsource-variable/geist-mono@5.3.0/index.css"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/themes/vue.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/docsify-copy-code@3.0.2/dist/docsify-copy-code.min.css"
    />
    <link rel="stylesheet" href="styles/foundry.css" />
    <link rel="stylesheet" href="styles/prism-foundry.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="app">
      <div class="loading-shell" aria-label="Loading documentation">
        <span class="loading-mark" aria-hidden="true"></span>
        <span>Loading foundry-lib</span>
      </div>
    </div>

    <script>
      window.$docsify = {
        name: 'foundry-lib',
        nameLink: '/',
        repo: 'jmchilton/foundry-lib',
        homepage: 'README.md',
        loadSidebar: '_sidebar.md',
        loadNavbar: '_navbar.md',
        coverpage: '_coverpage.md',
        notFoundPage: '_404.md',
        auto2top: true,
        autoHeader: true,
        maxLevel: 3,
        subMaxLevel: 2,
        relativePath: false,
        search: {
          maxAge: 86400000,
          paths: 'auto',
          placeholder: 'Search the documentation',
          noData: 'No matching documentation',
          depth: 3,
        },
        copyCode: {
          buttonText: 'Copy',
          errorText: 'Error',
          successText: 'Copied',
        },
        formatUpdated: '{YYYY}-{MM}-{DD}',
        plugins: [
          function (hook) {
            hook.doneEach(function () {
              const content = document.querySelector('main');
              if (content) {
                content.id = 'main';
              }
            });
          },
        ],
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/zoom-image.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@3.0.2/dist/docsify-copy-code.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-bash.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-typescript.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-json.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-yaml.min.js"></script>
  </body>
</html>

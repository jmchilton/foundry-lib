name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - run: pnpm format

      - run: pnpm lint

      - run: pnpm lint:unused:ci

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - run: pnpm build

      - run: pnpm test

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - run: pnpm build

      # Validate package.json exports and the emitted declaration surface before
      # exercising the tarballs at runtime.
      - run: pnpm lint:packages

      # The only check that installs exactly what npm would receive.
      - run: pnpm smoke

  # A PR that changes a published package without a changeset merges green and then
  # ships nothing — the release workflow sees no pending changesets and no-ops. That
  # failure is silent and only shows up when someone wonders why the fix isn't on npm.
  #
  # Skipped on the release branch: the Version Packages PR consumes the changesets it
  # is acting on, so it always looks like a package change with none pending.
  changeset:
    if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # `changeset status --since` needs the base branch history

      - uses: ./.github/actions/setup

      - run: pnpm changeset status --since=origin/${{ github.base_ref }}

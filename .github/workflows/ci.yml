name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format

      - run: pnpm typecheck

      - run: pnpm build

      - run: pnpm test

      # Runs last because it needs the built dist/, and it is the only check that
      # exercises the tarball rather than the source tree.
      - run: pnpm smoke

  # A PR that changes a published package without a changeset merges green and then
  # ships nothing — the release workflow sees no pending changesets and no-ops. That
  # failure is silent and only shows up when someone wonders why the fix isn't on npm.
  #
  # Skipped on the release branch: the Version Packages PR consumes the changesets it
  # is acting on, so it always looks like a package change with none pending.
  changeset:
    if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # `changeset status --since` needs the base branch history

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm changeset status --since=origin/${{ github.base_ref }}
